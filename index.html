<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller Pro Elite V3</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            /* Background sangat gelap dan premium */
            --main-bg: linear-gradient(135deg, #4b6a8a 0%, #163d63 40%, #01080f 100%);
            --btn-blue: linear-gradient(180deg, #1e5799 0%, #2989d8 50%, #207cca 51%, #1e5799 100%);
            --panel-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0; padding: 0;
            background: var(--main-bg);
            background-attachment: fixed;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            -webkit-user-select: none;
        }
        
.net-error{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.35);
    z-index:5000;
}

.net-error-box{
    text-align:center;
    padding:25px 35px;
    border-radius:16px;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.wifi-icon{
    font-size:42px;
    margin-bottom:10px;
}

.net-title{
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    color:#ff3b30;
}

.net-sub{
    font-size:13px;
    color:#bbb;
    margin-top:5px;
}

.net-status{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 0;
    z-index: 2000;
    letter-spacing: 1px;
}

.net-online{
    background:#0f5132;
    color:#4cd964;
}

.net-offline{
    background:#3a0b0b;
    color:#ff3b30;
}
        .header-title {
            font-size: 38px; font-weight: 300; margin-top: 35px;
            letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .display-screen {
            margin: 20px 0 10px 0;
            width: 190px; height: 125px;
            background: #000;
            border: 3px solid #1a5ca3;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(26, 92, 163, 0.5), inset 0 0 15px #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative;
        }

        #turn-indicator {
            position: absolute; top: 8px;
            width: 40px; height: 8px; border-radius: 10px;
            background: #111; transition: 0.3s;
        }

        #res {
            font-size: 80px; font-weight: bold; color: #fff;
        }

        .mode-text {
            color: #aaa; font-size: 20px; font-weight: 400;
            margin-bottom: 5px; text-transform: uppercase;
        }
.gm-indicator{
    position:absolute;
    top:-22px;
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
    text-shadow:0 0 6px rgba(0,0,0,0.7);
}
.gm-blue{ color:#007aff; }
.gm-red{ color:#ff3b30; }
.gm-green{ color:#4cd964; }
.gm-yellow{ color:#ffcc00; }

        /* Container Bulatan Pemain Dinamis */
        .player-count-dots {
            display: flex; gap: 10px; margin-bottom: 25px; height: 14px;
            padding: 6px 15px; border-radius: 20px; background: var(--panel-bg);
        }
        .dot {
            width: 14px; height: 14px; border-radius: 50%;
            display: none; /* Default tersembunyi */
            transition: 0.3s;
        }

        .control-panel {
            width: 80%; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 25px;
        }

        .god-btn { font-size: 32px; font-weight: bold; cursor: pointer; }
        .settings-btn { font-size: 34px; cursor: pointer; }

        .grid-pad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
        }

        .btn {
            width: 95px; height: 85px;
            background: var(--btn-blue);
            border: 1px solid #104880;
            border-radius: 15px;
            font-size: 40px; font-weight: 600;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #0a2e52, 0 8px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0a2e52; }

        /* Status Colors */
        .bg-blue { background: #007aff !important; box-shadow: 0 0 10px #007aff; }
        .bg-red { background: #ff3b30 !important; box-shadow: 0 0 10px #ff3b30; }
        .bg-green { background: #4cd964 !important; box-shadow: 0 0 10px #4cd964; }
        .bg-yellow { background: #ffcc00 !important; box-shadow: 0 0 10px #ffcc00; }

        /* Modals */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: #1c1f24; width: 80%; max-width: 300px;
            border-radius: 15px; padding: 25px; text-align: center; border: 1px solid #333;
        }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #000; color: #0f0; border-radius: 8px; border:1px solid #444; text-align:center; font-size:18px;}
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .save { background: #1a5ca3; color: white; }
    </style>
</head>
<div id="net-error" class="net-error">
    <div class="net-error-box">
        <div class="wifi-icon">📡</div>
        <div class="net-title">NO INTERNET ACCESS</div>
        <div class="net-sub">Please enable network connection</div>
    </div>
</div>

<body>
<div id="net-status" class="net-status offline">OFFLINE</div>
    <div class="header-title">Controller Pro</div>

    <div class="display-screen">
 <div id="gm-indicator" class="gm-indicator">AUTO WIN: -</div>

        <div id="turn-indicator"></div>
        <div id="res">-</div>
    </div>

    <div class="mode-text" id="m-type">SYNCING...</div>
    
    <div class="player-count-dots" id="dot-container">
        <div class="dot" id="dot-blue"></div>
        <div class="dot" id="dot-red"></div>
        <div class="dot" id="dot-green"></div>
        <div class="dot" id="dot-yellow"></div>
    </div>

    <div class="control-panel">
        <div class="god-btn" onclick="openModal('gmModal')">Auto Win</div>
        <div class="settings-btn" onclick="openModal('licModal')">⚙️</div>
    </div>

    <div class="grid-pad">
        <div class="btn" onclick="sendDice(1)">1</div>
        <div class="btn" onclick="sendDice(2)">2</div>
        <div class="btn" onclick="sendDice(3)">3</div>
        <div class="btn" onclick="sendDice(4)">4</div>
        <div class="btn" onclick="sendDice(5)">5</div>
        <div class="btn" onclick="sendDice(6)">6</div>
    </div>

    <div class="overlay" id="licModal">
        <div class="modal">
            <h3>DATABASE LOGIN</h3>
            <input type="text" id="licInput" placeholder="Enter License ID">
            <button class="action-btn save" onclick="saveLic()">ACTIVATE</button>
            <button class="action-btn" onclick="closeModal('licModal')">CLOSE</button>
        </div>
    </div>

    <div class="overlay" id="gmModal">
        <div class="modal">
            <h3>GOD MODE</h3>
            <button class="action-btn bg-blue" style="color:white" onclick="pushGM('blue')">BLUE</button>
            <button class="action-btn bg-red" style="color:white" onclick="pushGM('red')">RED</button>
            <button class="action-btn bg-green" style="color:white" onclick="pushGM('green')">GREEN</button>
            <button class="action-btn bg-yellow" style="color:white" onclick="pushGM('yellow')">YELLOW</button>
            <hr style="border:0; border-top:1px solid #333; margin:10px 0">
            <button class="action-btn" onclick="pushGM('')">RESET OFF</button>
            <button class="action-btn" onclick="closeModal('gmModal')">CANCEL</button>
        </div>
    </div>
