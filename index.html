<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACK DICE WEB</title>

<!-- Firebase Legacy (support new Firebase(url)) -->
<script src="https://cdn.firebase.com/js/client/2.4.2/firebase.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#2C3E50;
    color:#ECF0F1;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:420px;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    text-align:center;
}

.app-name h1{
    font-size:26px;
    text-shadow:2px 2px red;
}

.date-time{font-size:14px;}
.status{font-size:14px;}

.signal-indicator{
    width:18px;height:18px;border-radius:50%;
    background:red;
    box-shadow:0 0 15px rgba(0,255,0,0.6);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

.god-mode{
    font-size:18px;
    color:#FF9800;
}

input{
    width:85%;
    padding:10px;
    font-size:22px;
    text-align:center;
    border-radius:10px;
    border:none;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    width:100%;
}

.button-3d{
    background:linear-gradient(145deg,#555,#bdc3c7);
    border-radius:20px;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:4px 4px 8px #000;
}

.action button{
    padding:10px 25px;
    font-size:18px;
    margin:10px;
    border-radius:20px;
    border:none;
    background:#3498DB;
    color:white;
    cursor:pointer;
    box-shadow:2px 2px 10px #000;
}

.motivational-text{
    font-size:18px;
    color:#F1C40F;
    font-weight:bold;
}

/* =============================
   FLOATING NUMBER EFFECT
   ============================= */
.floating-number {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    font-weight: bold;
    color: #00FFAA;
    text-shadow: 0 0 15px #00FFAA;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    z-index: 9999;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    50% {
        opacity: 1;
        transform: translate(-50%, -90%) scale(1.2);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -130%) scale(0.8);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="app-name">
        <h1>𝐇𝐀𝐂𝐊 𝐃𝐈𝐂𝐄</h1>
    </div>

    <div class="date-time" id="date-time"></div>

    <div class="status">
        Status Server:
        <span id="server">Checking...</span>
    </div>

    <div class="signal-indicator" id="signal"></div>

    <div class="god-mode">𝐆𝐎𝐃 𝐌𝐎𝐃𝐄</div>

    <input type="text" id="data" placeholder="Masukkan angka target..." readonly>

    <div class="keyboard">
        <div class="button-3d" onclick="addNumber(1)">1</div>
        <div class="button-3d" onclick="addNumber(2)">2</div>
        <div class="button-3d" onclick="addNumber(3)">3</div>
        <div class="button-3d" onclick="addNumber(4)">4</div>
        <div class="button-3d" onclick="addNumber(5)">5</div>
        <div class="button-3d" onclick="addNumber(6)">6</div>
    </div>

    <div class="action">
        <button onclick="hapus()">Hapus</button>
        <button onclick="kirim()">Kirim</button>
    </div>

    <div class="motivational-text">
        "𝐏𝐑𝐄𝐌𝐈𝐔𝐌 𝐀𝐏𝐋𝐈𝐂𝐀𝐓𝐈𝐎𝐍"
    </div>

</div>

<script>

/* ==============================
   EXPIRY FORMAT SAMA SEPERTI APK
   ============================== */

var expiryRaw = "<!>: 2026/02/15 20:04<!>";

function checkExpiry(){
    var match = expiryRaw.match(/<!>: (.*?)<!>/);
    if(match){
        var expDate = new Date(match[1]);
        var now = new Date();

        if(now > expDate){
            alert("Aplikasi sudah kadaluarsa!\nHubungi Developer.");
            document.body.innerHTML =
                "<h2 style='color:red;text-align:center;margin-top:50%;'>EXPIRED</h2>";
            throw new Error("Expired");
        }
    }
}

checkExpiry();

/* ==============================
   FIREBASE STRUCTURE TETAP
   ============================== */

var urlDB = "https://pasukansenyap2-be175-default-rtdb.firebaseio.com/dicersd/";
var dbRef = new Firebase(urlDB);

/* ==============================
   REALTIME LISTENER
   ============================== */
dbRef.on("value", function(snapshot){
    var data = snapshot.val();
    if(data){
        document.getElementById("server").innerText = "ONLINE";
        document.getElementById("signal").style.background = "lime";
    }
});

/* ==============================
   FLOATING NUMBER FUNCTION
   ============================== */
function showFloatingNumber(text) {
    var floatEl = document.createElement("div");
    floatEl.className = "floating-number";
    floatEl.innerText = text;
    document.body.appendChild(floatEl);

    setTimeout(function(){
        floatEl.remove();
    }, 1000);
}

/* ==============================
   INPUT CONTROL
   ============================== */
function addNumber(num){
    document.getElementById("data").value += num;
}

function hapus(){
    var input = document.getElementById("data");
    input.value = input.value.slice(0,-1);
}

/* ==============================
   SEND DATA
   ============================== */
function kirim(){
    var value = document.getElementById("data").value.trim();
    if(value === ""){
        alert("Masukkan angka terlebih dahulu!");
        return;
    }

    dbRef.set({
        time: new Date().getTime(),
        results: value
    });

    showFloatingNumber(value);
    document.getElementById("data").value = "";
}

/* ==============================
   JAM REALTIME
   ============================== */
function updateTime(){
    document.getElementById("date-time").innerText =
        new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta"});
}
setInterval(updateTime,1000);
updateTime();

</script>

</body>
</html>
